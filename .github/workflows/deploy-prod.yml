name: Deploy to Production

on:
  # workflow_dispatch ONLY, deliberately. Auto-triggering this on content
  # pushes (pages.json, PDFs, etc.) is the right long-term behaviour once
  # the site is genuinely live — but until the first real --prod deploy has
  # happened deliberately, this must never fire on its own: pages.json and
  # docs/dev/pdfs/ are touched by completely routine day-to-day work, which
  # would otherwise perform the live switchover itself as a side effect.
  # Re-add a push trigger (see git history) only after that first deploy.
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note describing this deploy (appears in the commit message)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      # Generator code (fsh_reboot/scripts/, fsh_reboot/template/) is pinned to
      # the 'stable' branch — only promoted there deliberately, via the
      # "Promote main to Stable" workflow. Everything else (pages.json,
      # content/*.md, PDFs, audio) always comes from main, so editors can
      # publish content changes independent of whatever's mid-development
      # on main and only visible on the dev preview so far.
      - name: Pin generator code to the stable branch
        run: |
          git fetch --depth=1 origin stable
          git checkout FETCH_HEAD -- fsh_reboot/scripts/ fsh_reboot/template/
          echo "Generator code pinned to stable @ $(git rev-parse FETCH_HEAD)"

      - name: Generate production site
        working-directory: fsh_reboot/scripts
        run: python generate.py --prod

      - name: Commit and push production output
        env:
          DEPLOY_NOTE: ${{ github.event.inputs.note }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/nl/ docs/easy/ docs/qr/ docs/admin/ docs/editor/ docs/pdfs/ archived_index_pages/
          if git diff --cached --quiet; then
            echo "Nothing to commit — production is already up to date"
          else
            if [ -n "$DEPLOY_NOTE" ]; then
              MSG="Deploy to production: $DEPLOY_NOTE [skip ci]"
            else
              MSG="Deploy to production [skip ci]"
            fi
            git commit -m "$MSG"
            git push
          fi
