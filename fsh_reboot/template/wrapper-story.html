<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PAGE_TITLE --> – The Heritage of Fleet Street</title>
  <meta name="description" content="<!-- PAGE_DESCRIPTION -->">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=<!-- GA_ID -->"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '<!-- GA_ID -->');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fsh-blue:   #254760;
      --fsh-yellow: #FFFF66;
      --fsh-white:  #ffffff;
      --bar-full:   4rem;
      --bar-compact: 2.75rem;
      --transition: 0.3s ease;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fsh-blue);
      color: var(--fsh-white);
      min-height: 100dvh;
    }

    /* ── Header bar (matches the PDF wrapper) ──────────────── */
    #fsh-bar {
      background: var(--fsh-blue);
      color: var(--fsh-white);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      height: var(--bar-full);
      transition: height var(--transition);
      flex-shrink: 0;
      overflow: hidden;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }

    body.returning #fsh-bar {
      height: var(--bar-compact);
    }

    #fsh-bar .site-title {
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }

    body.returning #fsh-bar .site-title {
      font-size: 0.85rem;
    }

    #fsh-bar a.site-title,
    #fsh-bar a.site-title:hover,
    #fsh-bar a.site-title:focus {
      border: none;
      padding: 0;
      background: none;
      border-radius: 0;
    }

    #fsh-bar .page-title {
      font-size: 0.9rem;
      color: var(--fsh-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    body.returning #fsh-bar .page-title {
      font-size: 0.8rem;
    }

    #fsh-bar nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #fsh-bar a, #fsh-bar button {
      color: var(--fsh-white);
      text-decoration: none;
      font-size: 0.8rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition);
    }

    #fsh-bar a:hover, #fsh-bar button:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.7);
    }

    #audio-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    audio {
      height: 1.6rem;
      max-width: 10rem;
    }

    .unavailable { display: none !important; }

    /* ── Skip link (accessibility) ───────────────────────── */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      padding: 0.5rem 1rem;
      font-weight: bold;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }

    /* ── Story content ──────────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .story h1 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      margin-bottom: 0.25rem;
    }

    .story h2 {
      font-size: 1rem;
      font-weight: normal;
      color: var(--fsh-yellow);
      margin-bottom: 1.5rem;
    }

    .story p {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 1.1rem;
    }

    .story a {
      color: var(--fsh-yellow);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .story hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.25);
      margin: 1.75rem 0;
    }

    .story img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.5rem auto;
      border-radius: 4px;
    }

    .story .small { font-size: 0.8rem; }
    .story .muted { opacity: 0.65; }
  </style>
</head>
<body>

  <a class="skip-link" href="#story-content">Skip to content</a>

  <header id="fsh-bar" role="banner">

    <a class="site-title" href="<!-- HOME_URL -->" aria-label="The Heritage of Fleet Street">The Heritage of Fleet Street</a>

    <span class="page-title" aria-current="page"><!-- PAGE_TITLE --></span>

    <nav aria-label="Page controls">

      <!-- Audio player — hidden if no audio file for this page -->
      <div id="audio-wrap" class="unavailable" aria-label="Audio narration">
        <audio id="audio-player" controls preload="none" aria-label="Listen to narration">
          <source src="<!-- AUDIO_FILE -->" type="audio/mpeg">
        </audio>
      </div>

      <!-- Prev / Next -->
      <a id="nav-prev" href="<!-- PREV_URL -->" aria-label="Previous page">&#8592; Prev</a>
      <a id="nav-next" href="<!-- NEXT_URL -->" aria-label="Next page">Next &#8594;</a>

      <!-- Home -->
      <a href="<!-- HOME_URL -->" aria-label="Return to home page">Home</a>

    </nav>
  </header>

  <main id="story-content">
    <article class="story">
<!-- STORY_HTML -->
    </article>
  </main>

  <script>
    // ── Config (set per page) ──────────────────────────────
    const PAGE_ID   = '<!-- PAGE_ID -->';
    const PAGE_NUM  = '<!-- PAGE_NUM -->';
    const HAS_AUDIO = <!-- HAS_AUDIO -->;

    // ── Source code → readable label (for GA) ──────────────
    const params = new URLSearchParams(window.location.search);
    const src    = params.get('s') || '';
    <!-- SRC_MAP_JS -->

    // ── Returning visitor detection ────────────────────────
    const VISITED_KEY = 'fsh_visited';
    if (localStorage.getItem(VISITED_KEY)) {
      document.body.classList.add('returning');
    } else {
      localStorage.setItem(VISITED_KEY, '1');
    }

    // ── Audio ──────────────────────────────────────────────
    if (HAS_AUDIO) {
      const wrap = document.getElementById('audio-wrap');
      wrap.classList.remove('unavailable');

      document.getElementById('audio-player').addEventListener('play', () => {
        gtag('event', 'audio_play', {
          page_id: PAGE_ID,
          page_num: PAGE_NUM,
          src_param: expandSrc(src)
        });
      });
    }

    // ── GA page view with content group + source ───────────
    gtag('event', 'page_view', {
      page_id:       PAGE_ID,
      page_num:      PAGE_NUM,
      content_group: PAGE_NUM.substring(0, 1) + 'xx',
      view:          'story',
      src_param:     expandSrc(src)
    });
  </script>

</body>
</html>
