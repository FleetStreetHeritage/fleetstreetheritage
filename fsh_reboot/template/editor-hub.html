<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSH Editor</title>
  <!-- GA_ID -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      background: #254760;
      color: #fff;
      padding: 2rem 1.5rem 4rem;
      max-width: 780px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      color: #FFFF66;
      margin-bottom: 0.25rem;
    }
    .meta {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 2rem;
    }
    .meta a { color: rgba(255,255,255,0.6); }
    .meta a:hover { color: #FFFF66; }
    .nav-links {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      display: inline-block;
      padding: 0.55rem 1.2rem;
      background: #1a3450;
      color: #FFFF66;
      text-decoration: none;
      border-radius: 5px;
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .nav-links a:hover { background: #0f2030; }
    .workflow h2 {
      font-size: 1.1rem;
      color: #FFFF66;
      margin: 1.8rem 0 0.5rem;
      text-transform: none;
      letter-spacing: 0;
    }
    .workflow h3 {
      font-size: 0.95rem;
      color: #FFFF66;
      margin: 1.4rem 0 0.4rem;
    }
    .workflow p  { margin-bottom: 0.7rem; color: rgba(255,255,255,0.9); }
    .workflow a  { color: #FFFF66; text-decoration: underline; }
    .workflow a:hover { text-decoration: none; }
    .workflow ul, .workflow ol {
      padding-left: 1.4rem;
      margin-bottom: 0.8rem;
      color: rgba(255,255,255,0.9);
    }
    .workflow li { margin-bottom: 0.3rem; }
    .workflow strong { color: #fff; }
    .workflow em { color: rgba(255,255,255,0.75); font-style: italic; }
    .workflow hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 1.8rem 0;
    }
    .workflow code {
      background: rgba(0,0,0,0.3);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-family: Menlo, monospace;
      font-size: 0.88em;
    }
    .workflow pre {
      background: rgba(0,0,0,0.35);
      border-radius: 5px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.8rem;
      overflow-x: auto;
    }
    .workflow pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
      color: #cfe8ff;
    }
  </style>
</head>
