<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PAGE_TITLE --> (Easy Read) – The Heritage of Fleet Street</title>
  <meta name="description" content="Easy Read version: <!-- PAGE_DESCRIPTION -->">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=<!-- GA_ID -->"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '<!-- GA_ID -->');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fsh-blue:    #254760;
      --fsh-yellow:  #FFFF66;
      --fsh-white:   #ffffff;
      --bar-full:    4rem;
      --bar-compact: 2.75rem;
      --transition:  0.3s ease;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #fsh-bar {
      background: var(--fsh-blue);
      color: var(--fsh-white);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      height: var(--bar-full);
      transition: height var(--transition);
      flex-shrink: 0;
      overflow: hidden;
    }

    body.returning #fsh-bar { height: var(--bar-compact); }

    #fsh-bar .site-title {
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    body.returning #fsh-bar .site-title { font-size: 0.85rem; }

    #fsh-bar .page-title {
      font-size: 0.9rem;
      color: var(--fsh-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    body.returning #fsh-bar .page-title { font-size: 0.8rem; }

    /* Easy Read badge on bar */
    #fsh-bar .view-badge {
      font-size: 0.7rem;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      font-weight: bold;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #fsh-bar nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #fsh-bar a, #fsh-bar button {
      color: var(--fsh-white);
      text-decoration: none;
      font-size: 0.8rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition);
    }

    #fsh-bar a:hover, #fsh-bar button:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.7);
    }

    #view-toggle {
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      border-color: var(--fsh-yellow);
      font-weight: bold;
    }

    #audio-wrap { display: flex; align-items: center; gap: 0.4rem; }
    audio { height: 1.6rem; max-width: 10rem; }
    .unavailable { display: none !important; }

    #pdf-wrap { flex: 1; overflow: hidden; min-height: 0; }
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; }
    #pdf-wrap.touch { overflow: auto; background: #555; -webkit-overflow-scrolling: touch; }
    #pdf-canvas { display: block; }
    #pdf-msg { padding: 2rem; color: #fff; font-size: 0.9rem; }
    #pdf-msg a { color: var(--fsh-yellow); }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      padding: 0.5rem 1rem;
      font-weight: bold;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }
  </style>
</head>
<body>

  <a class="skip-link" href="#pdf-wrap">Skip to content</a>

  <header id="fsh-bar" role="banner">

    <span class="site-title" aria-label="The Heritage of Fleet Street">The Heritage of Fleet Street</span>

    <span class="view-badge" aria-label="Easy Read version">Easy Read</span>

    <span class="page-title" aria-current="page"><!-- PAGE_TITLE --></span>

    <nav aria-label="Page controls">

      <div id="audio-wrap" class="unavailable" aria-label="Audio narration">
        <audio id="audio-player" controls preload="none" aria-label="Listen to narration">
          <source src="<!-- AUDIO_FILE -->" type="audio/mpeg">
        </audio>
      </div>

      <button id="view-toggle"
              aria-label="Switch to Natural Language version"
              aria-pressed="true">
        Natural Language
      </button>

      <!-- Zoom toggle -->
      <button id="zoom-toggle" aria-label="Zoom in on PDF">Zoom in</button>

      <a id="nav-prev" href="<!-- PREV_URL -->" aria-label="Previous page">&#8592; Prev</a>
      <a id="nav-next" href="<!-- NEXT_URL -->" aria-label="Next page">Next &#8594;</a>

      <a href="../index.html" aria-label="Return to home page">Home</a>

    </nav>
  </header>

  <main id="pdf-wrap"></main>

  <script>
    const PAGE_ID   = '<!-- PAGE_ID -->';
    const PAGE_NUM  = '<!-- PAGE_NUM -->';
    const HAS_AUDIO = <!-- HAS_AUDIO -->;
    const NL_URL    = '<!-- NL_URL -->';
    const AUDIO_SRC = '<!-- AUDIO_FILE -->';

    const STORAGE_KEY = 'fsh_view';
    const VISITED_KEY = 'fsh_visited';
    const params      = new URLSearchParams(window.location.search);
    const src         = params.get('src') || '';

    // Being on this page means view = easy; ensure stored pref matches
    // (unless user arrived via f=1, but we don't redirect from ER page)
    // We do NOT force-write here — the NL page handles f= logic before redirect.
    // Arriving here naturally means we just record easy as the current view.

    // Returning visitor
    if (localStorage.getItem(VISITED_KEY)) {
      document.body.classList.add('returning');
    } else {
      localStorage.setItem(VISITED_KEY, '1');
    }

    // Audio
    if (HAS_AUDIO) {
      const wrap = document.getElementById('audio-wrap');
      wrap.classList.remove('unavailable');

      document.getElementById('audio-player').addEventListener('play', () => {
        gtag('event', 'audio_play', {
          page_id:  PAGE_ID,
          page_num: PAGE_NUM,
          view:     'easy',
          src_param: src
        });
      });
    }

    // ── PDF rendering (touch = PDF.js canvas; desktop = iframe) ──
    const PDF_SRC = '<!-- EASY_PDF_FILE -->';
    const wrap    = document.getElementById('pdf-wrap');
    const zoomBtn = document.getElementById('zoom-toggle');

    if ('ontouchstart' in window) {
      // ── Touch: PDF.js canvas ───────────────────────────────
      wrap.classList.add('touch');

      const pdfMsg = document.createElement('p');
      pdfMsg.id = 'pdf-msg';
      pdfMsg.textContent = 'Loading…';
      wrap.appendChild(pdfMsg);

      const canvas = document.createElement('canvas');
      canvas.id = 'pdf-canvas';
      canvas.tabIndex = 0;
      canvas.setAttribute('aria-label', '<!-- PAGE_TITLE --> – Easy Read information panel');
      canvas.hidden = true;
      wrap.appendChild(canvas);

      const pdfCtx = canvas.getContext('2d');
      let pdfDoc = null, userScale = 1, zoomed = false, busy = false, queued = false;

      async function renderPage() {
        if (!pdfDoc) return;
        if (busy) { queued = true; return; }
        busy = true;
        const page     = await pdfDoc.getPage(1);
        const dpr      = window.devicePixelRatio || 1;
        const baseVP   = page.getViewport({ scale: 1 });
        const fitScale = wrap.clientWidth / baseVP.width;
        const viewport = page.getViewport({ scale: fitScale * userScale * dpr });
        canvas.width        = Math.floor(viewport.width);
        canvas.height       = Math.floor(viewport.height);
        canvas.style.width  = Math.floor(viewport.width  / dpr) + 'px';
        canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
        pdfCtx.clearRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: pdfCtx, viewport }).promise;
        busy = false;
        if (queued) { queued = false; renderPage(); }
      }

      function applyScale(scale) {
        userScale = Math.min(4, Math.max(0.5, scale));
        zoomed    = userScale > 1.05;
        zoomBtn.textContent = zoomed ? 'Fit width' : 'Zoom in';
        zoomBtn.setAttribute('aria-label',
          zoomed ? 'Fit PDF to screen width' : 'Zoom in on PDF');
        renderPage();
      }

      zoomBtn.addEventListener('click', () => {
        if (zoomed) { applyScale(1); wrap.scrollLeft = 0; wrap.scrollTop = 0; }
        else        { applyScale(1.75); }
      });

      let pinchActive = false, pinchStartDist = 0, pinchBaseScale = 1;
      wrap.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          pinchActive    = true;
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY);
          pinchBaseScale = userScale;
        }
      }, { passive: true });
      wrap.addEventListener('touchmove', e => {
        if (!pinchActive || e.touches.length !== 2) return;
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY);
        canvas.style.transform       = `scale(${dist / pinchStartDist})`;
        canvas.style.transformOrigin = 'top left';
      }, { passive: true });
      wrap.addEventListener('touchend', e => {
        if (!pinchActive || e.touches.length >= 2) return;
        pinchActive = false;
        const match = canvas.style.transform.match(/scale\(([^)]+)\)/);
        canvas.style.transform = '';
        applyScale(pinchBaseScale * (match ? parseFloat(match[1]) : 1));
      }, { passive: true });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (!zoomed) renderPage(); }, 200);
      });

      const pdfjs = document.createElement('script');
      pdfjs.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      pdfjs.onload = async () => {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        try {
          pdfDoc = await pdfjsLib.getDocument(PDF_SRC).promise;
          await renderPage();
          canvas.hidden = false;
          pdfMsg.hidden = true;
        } catch {
          pdfMsg.innerHTML =
            `Could not load PDF. <a href="${PDF_SRC}">Download it here</a>.`;
        }
      };
      document.head.appendChild(pdfjs);

    } else {
      // ── Desktop: native iframe ─────────────────────────────
      zoomBtn.classList.add('unavailable');
      const frame = document.createElement('iframe');
      frame.id       = 'pdf-frame';
      frame.src      = PDF_SRC + '#zoom=fitH';
      frame.title    = '<!-- PAGE_TITLE --> – Easy Read information panel';
      frame.tabIndex = 0;
      wrap.appendChild(frame);
    }

    // Toggle back to NL — saves preference
    document.getElementById('view-toggle').addEventListener('click', () => {
      localStorage.setItem(STORAGE_KEY, 'nl');

      gtag('event', 'view_switch', {
        from:      'easy',
        to:        'nl',
        page_id:   PAGE_ID,
        src_param: src
      });

      const dest = new URL(NL_URL, window.location.href);
      if (src) dest.searchParams.set('src', src);
      window.location.href = dest.toString();
    });

    // GA page view
    gtag('event', 'page_view', {
      page_id:       PAGE_ID,
      page_num:      PAGE_NUM,
      content_group: PAGE_NUM.substring(0, 1) + 'xx',
      view:          'easy',
      src_param:     src
    });
  </script>

</body>
</html>
