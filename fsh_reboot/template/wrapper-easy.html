<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PAGE_TITLE --> (Easy Read) – The Heritage of Fleet Street</title>
  <meta name="description" content="Easy Read version: <!-- PAGE_DESCRIPTION -->">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E01B51HMZL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E01B51HMZL');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fsh-blue:    #254760;
      --fsh-yellow:  #FFFF66;
      --fsh-white:   #ffffff;
      --bar-full:    4rem;
      --bar-compact: 2.75rem;
      --transition:  0.3s ease;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #fsh-bar {
      background: var(--fsh-blue);
      color: var(--fsh-white);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      height: var(--bar-full);
      transition: height var(--transition);
      flex-shrink: 0;
      overflow: hidden;
    }

    body.returning #fsh-bar { height: var(--bar-compact); }

    #fsh-bar .site-title {
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    body.returning #fsh-bar .site-title { font-size: 0.85rem; }

    #fsh-bar .page-title {
      font-size: 0.9rem;
      color: var(--fsh-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    body.returning #fsh-bar .page-title { font-size: 0.8rem; }

    /* Easy Read badge on bar */
    #fsh-bar .view-badge {
      font-size: 0.7rem;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      font-weight: bold;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #fsh-bar nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #fsh-bar a, #fsh-bar button {
      color: var(--fsh-white);
      text-decoration: none;
      font-size: 0.8rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition);
    }

    #fsh-bar a:hover, #fsh-bar button:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.7);
    }

    #view-toggle {
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      border-color: var(--fsh-yellow);
      font-weight: bold;
    }

    #audio-wrap { display: flex; align-items: center; gap: 0.4rem; }
    audio { height: 1.6rem; max-width: 10rem; }
    .unavailable { display: none !important; }

    #pdf-wrap { flex: 1; overflow: hidden; min-height: 0; }
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      padding: 0.5rem 1rem;
      font-weight: bold;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }
  </style>
</head>
<body>

  <a class="skip-link" href="#pdf-frame">Skip to content</a>

  <header id="fsh-bar" role="banner">

    <span class="site-title" aria-label="The Heritage of Fleet Street">The Heritage of Fleet Street</span>

    <span class="view-badge" aria-label="Easy Read version">Easy Read</span>

    <span class="page-title" aria-current="page"><!-- PAGE_TITLE --></span>

    <nav aria-label="Page controls">

      <div id="audio-wrap" class="unavailable" aria-label="Audio narration">
        <audio id="audio-player" controls preload="none" aria-label="Listen to narration">
          <source src="<!-- AUDIO_FILE -->" type="audio/mpeg">
        </audio>
      </div>

      <button id="view-toggle"
              aria-label="Switch to Natural Language version"
              aria-pressed="true">
        Natural Language
      </button>

      <!-- Zoom toggle -->
      <button id="zoom-toggle" aria-label="Zoom in on PDF">Zoom in</button>

      <a id="nav-prev" href="<!-- PREV_URL -->" aria-label="Previous page">&#8592; Prev</a>
      <a id="nav-next" href="<!-- NEXT_URL -->" aria-label="Next page">Next &#8594;</a>

      <a href="../index.html" aria-label="Return to home page">Home</a>

    </nav>
  </header>

  <main id="pdf-wrap">
    <iframe
      id="pdf-frame"
      src="<!-- EASY_PDF_FILE -->#zoom=fitH"
      title="<!-- PAGE_TITLE --> – Easy Read information panel"
      tabindex="0">
      <p>Your browser cannot display this PDF.
         <a href="<!-- EASY_PDF_FILE -->">Download it here</a>.</p>
    </iframe>
  </main>

  <script>
    const PAGE_ID   = '<!-- PAGE_ID -->';
    const PAGE_NUM  = '<!-- PAGE_NUM -->';
    const HAS_AUDIO = <!-- HAS_AUDIO -->;
    const NL_URL    = '<!-- NL_URL -->';
    const AUDIO_SRC = '<!-- AUDIO_FILE -->';

    const STORAGE_KEY = 'fsh_view';
    const VISITED_KEY = 'fsh_visited';
    const params      = new URLSearchParams(window.location.search);
    const src         = params.get('src') || '';

    // Being on this page means view = easy; ensure stored pref matches
    // (unless user arrived via f=1, but we don't redirect from ER page)
    // We do NOT force-write here — the NL page handles f= logic before redirect.
    // Arriving here naturally means we just record easy as the current view.

    // Returning visitor
    if (localStorage.getItem(VISITED_KEY)) {
      document.body.classList.add('returning');
    } else {
      localStorage.setItem(VISITED_KEY, '1');
    }

    // Audio
    if (HAS_AUDIO) {
      const wrap = document.getElementById('audio-wrap');
      wrap.classList.remove('unavailable');

      document.getElementById('audio-player').addEventListener('play', () => {
        gtag('event', 'audio_play', {
          page_id:  PAGE_ID,
          page_num: PAGE_NUM,
          view:     'easy',
          src_param: src
        });
      });
    }

    // ── Zoom toggle ────────────────────────────────────────
    (function () {
      const frame = document.getElementById('pdf-frame');
      const btn   = document.getElementById('zoom-toggle');
      const base  = '<!-- EASY_PDF_FILE -->';
      let   fit   = true;

      btn.addEventListener('click', () => {
        fit = !fit;
        frame.src = base + (fit ? '#zoom=fitH' : '#zoom=150');
        btn.textContent = fit ? 'Zoom in' : 'Fit width';
        btn.setAttribute('aria-label', fit ? 'Zoom in on PDF' : 'Fit PDF to screen width');
      });
    })();

    // Toggle back to NL — saves preference
    document.getElementById('view-toggle').addEventListener('click', () => {
      localStorage.setItem(STORAGE_KEY, 'nl');

      gtag('event', 'view_switch', {
        from:      'easy',
        to:        'nl',
        page_id:   PAGE_ID,
        src_param: src
      });

      const dest = new URL(NL_URL, window.location.href);
      if (src) dest.searchParams.set('src', src);
      window.location.href = dest.toString();
    });

    // GA page view
    gtag('event', 'page_view', {
      page_id:       PAGE_ID,
      page_num:      PAGE_NUM,
      content_group: PAGE_NUM.substring(0, 1) + 'xx',
      view:          'easy',
      src_param:     src
    });
  </script>

</body>
</html>
