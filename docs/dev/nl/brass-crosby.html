<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brass Crosby – The Heritage of Fleet Street</title>
  <meta name="description" content="Brass Crosby">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZP7L32M9GB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZP7L32M9GB');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fsh-blue:   #254760;
      --fsh-yellow: #FFFF66;
      --fsh-white:  #ffffff;
      --bar-full:   4rem;
      --bar-compact: 2.75rem;
      --transition: 0.3s ease;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header bar ─────────────────────────────────────── */
    #fsh-bar {
      background: var(--fsh-blue);
      color: var(--fsh-white);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      height: var(--bar-full);
      transition: height var(--transition);
      flex-shrink: 0;
      overflow: hidden;
    }

    body.returning #fsh-bar {
      height: var(--bar-compact);
    }

    #fsh-bar .site-title {
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }

    body.returning #fsh-bar .site-title {
      font-size: 0.85rem;
    }

    #fsh-bar .page-title {
      font-size: 0.9rem;
      color: var(--fsh-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    body.returning #fsh-bar .page-title {
      font-size: 0.8rem;
    }

    #fsh-bar nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #fsh-bar a, #fsh-bar button {
      color: var(--fsh-white);
      text-decoration: none;
      font-size: 0.8rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition);
    }

    #fsh-bar a:hover, #fsh-bar button:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.7);
    }

    /* Easy Read toggle — yellow tint when active */
    #view-toggle.easy {
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      border-color: var(--fsh-yellow);
      font-weight: bold;
    }

    /* Audio controls */
    #audio-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    audio {
      height: 1.6rem;
      max-width: 10rem;
    }

    /* Hidden audio/toggle when no asset available */
    .unavailable { display: none !important; }

    /* ── PDF area ────────────────────────────────────────── */
    #pdf-wrap {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* Desktop: native iframe */
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; }

    /* Touch: PDF.js canvas */
    #pdf-wrap.touch {
      overflow: auto;
      background: #555;
      -webkit-overflow-scrolling: touch;
    }
    #pdf-canvas { display: block; }
    #pdf-msg { padding: 2rem; color: #fff; font-size: 0.9rem; }
    #pdf-msg a { color: var(--fsh-yellow); }

    /* ── Skip link (accessibility) ───────────────────────── */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      padding: 0.5rem 1rem;
      font-weight: bold;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }
  </style>
</head>
<body>

  <a class="skip-link" href="#pdf-wrap">Skip to content</a>

  <header id="fsh-bar" role="banner">

    <span class="site-title" aria-label="The Heritage of Fleet Street">The Heritage of Fleet Street</span>

    <span class="page-title" aria-current="page">Brass Crosby</span>

    <nav aria-label="Page controls">

      <!-- Audio player — hidden if no audio file for this page -->
      <div id="audio-wrap" class="unavailable" aria-label="Audio narration">
        <audio id="audio-player" controls preload="none" aria-label="Listen to narration">
          <source src="../audio/159.mp3" type="audio/mpeg">
        </audio>
      </div>

      <!-- Easy Read toggle — hidden if no Easy Read version exists -->
      <button id="view-toggle"
              class="unavailable"
              aria-label="Switch to Easy Read version"
              aria-pressed="false">
        Easy Read
      </button>

      <!-- Zoom toggle -->
      <button id="zoom-toggle" aria-label="Zoom in on PDF">Zoom in</button>

      <!-- Prev / Next -->
      <a id="nav-prev" href="james-boswell.html" aria-label="Previous page">&#8592; Prev</a>
      <a id="nav-next" href="william-hazlitt.html" aria-label="Next page">Next &#8594;</a>

      <!-- Home -->
      <a href="../index.html" aria-label="Return to home page">Home</a>

    </nav>
  </header>

  <main id="pdf-wrap"></main>

  <script>
    // ── Config (set per page) ──────────────────────────────
    const PAGE_ID   = 'brass-crosby';        // e.g. 'dr-johnson'
    const PAGE_NUM  = '159';        // e.g. '115'
    const HAS_AUDIO = false;         // true | false
    const HAS_EASY  = false;          // true | false
    const EASY_URL  = '../easy/brass-crosby.html';        // e.g. 'easy-dr-johnson.html'
    const NL_URL    = 'brass-crosby.html';          // e.g. 'dr-johnson.html'
    const AUDIO_SRC = '../audio/159.mp3';

    // ── View preference ────────────────────────────────────
    const STORAGE_KEY = 'fsh_view';
    const params      = new URLSearchParams(window.location.search);
    const src         = params.get('src') || '';
    const vParam      = params.get('v')   || '';
    const fParam      = parseInt(params.get('f') ?? '0', 10);

    function getStoredView() {
      return localStorage.getItem(STORAGE_KEY) || '';
    }

    function resolveView() {
      const stored = getStoredView();
      if (fParam === 2 && vParam) {
        localStorage.setItem(STORAGE_KEY, vParam);
        return vParam;
      }
      if (fParam === 1 && vParam) return vParam;
      // f=0: stored wins, v is fallback
      return stored || vParam || 'nl';
    }

    const targetView = resolveView();

    // If this is the NL page but user should see Easy Read, redirect
    if (targetView === 'easy' && HAS_EASY) {
      const dest = new URL(EASY_URL, window.location.href);
      if (src) dest.searchParams.set('src', src);
      window.location.replace(dest.toString());
    }

    // ── Returning visitor detection ────────────────────────
    const VISITED_KEY = 'fsh_visited';
    if (localStorage.getItem(VISITED_KEY)) {
      document.body.classList.add('returning');
    } else {
      localStorage.setItem(VISITED_KEY, '1');
    }

    // ── Audio ──────────────────────────────────────────────
    if (HAS_AUDIO) {
      const wrap = document.getElementById('audio-wrap');
      wrap.classList.remove('unavailable');

      document.getElementById('audio-player').addEventListener('play', () => {
        gtag('event', 'audio_play', {
          page_id: PAGE_ID,
          page_num: PAGE_NUM,
          src_param: src
        });
      });
    }

    // ── Easy Read toggle ───────────────────────────────────
    if (HAS_EASY) {
      const btn = document.getElementById('view-toggle');
      btn.classList.remove('unavailable');

      // Reflect current view in button state
      if (targetView === 'easy') {
        btn.textContent    = 'Natural Language';
        btn.setAttribute('aria-label', 'Switch to Natural Language version');
        btn.setAttribute('aria-pressed', 'true');
        btn.classList.add('easy');
      }

      btn.addEventListener('click', () => {
        // Toggle and save preference (f=2 behaviour on manual switch)
        const next = (targetView === 'easy') ? 'nl' : 'easy';
        localStorage.setItem(STORAGE_KEY, next);

        gtag('event', 'view_switch', {
          from: targetView,
          to: next,
          page_id: PAGE_ID,
          src_param: src
        });

        const dest = new URL(next === 'easy' ? EASY_URL : NL_URL, window.location.href);
        if (src) dest.searchParams.set('src', src);
        window.location.href = dest.toString();
      });
    }

    // ── PDF rendering (touch = PDF.js canvas; desktop = iframe) ──
    const PDF_SRC = '../pdfs/159.pdf';
    const wrap    = document.getElementById('pdf-wrap');
    const zoomBtn = document.getElementById('zoom-toggle');

    if ('ontouchstart' in window) {
      // ── Touch: PDF.js canvas ───────────────────────────────
      wrap.classList.add('touch');

      const pdfMsg = document.createElement('p');
      pdfMsg.id = 'pdf-msg';
      pdfMsg.textContent = 'Loading…';
      wrap.appendChild(pdfMsg);

      const canvas = document.createElement('canvas');
      canvas.id = 'pdf-canvas';
      canvas.tabIndex = 0;
      canvas.setAttribute('aria-label', 'Brass Crosby – information panel');
      canvas.hidden = true;
      wrap.appendChild(canvas);

      const pdfCtx = canvas.getContext('2d');
      let pdfDoc = null, userScale = 1, zoomed = false, busy = false, queued = false;

      async function renderPage() {
        if (!pdfDoc) return;
        if (busy) { queued = true; return; }
        busy = true;
        const page     = await pdfDoc.getPage(1);
        const dpr      = window.devicePixelRatio || 1;
        const baseVP   = page.getViewport({ scale: 1 });
        const fitScale = wrap.clientWidth / baseVP.width;
        const viewport = page.getViewport({ scale: fitScale * userScale * dpr });
        canvas.width        = Math.floor(viewport.width);
        canvas.height       = Math.floor(viewport.height);
        canvas.style.width  = Math.floor(viewport.width  / dpr) + 'px';
        canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
        pdfCtx.clearRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: pdfCtx, viewport }).promise;
        busy = false;
        if (queued) { queued = false; renderPage(); }
      }

      function applyScale(scale) {
        userScale = Math.min(4, Math.max(0.5, scale));
        zoomed    = userScale > 1.05;
        zoomBtn.textContent = zoomed ? 'Fit width' : 'Zoom in';
        zoomBtn.setAttribute('aria-label',
          zoomed ? 'Fit PDF to screen width' : 'Zoom in on PDF');
        renderPage();
      }

      zoomBtn.addEventListener('click', () => {
        if (zoomed) { applyScale(1); wrap.scrollLeft = 0; wrap.scrollTop = 0; }
        else        { applyScale(1.75); }
      });

      let pinchActive = false, pinchStartDist = 0, pinchBaseScale = 1;
      wrap.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          pinchActive    = true;
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY);
          pinchBaseScale = userScale;
        }
      }, { passive: true });
      wrap.addEventListener('touchmove', e => {
        if (!pinchActive || e.touches.length !== 2) return;
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY);
        canvas.style.transform       = `scale(${dist / pinchStartDist})`;
        canvas.style.transformOrigin = 'top left';
      }, { passive: true });
      wrap.addEventListener('touchend', e => {
        if (!pinchActive || e.touches.length >= 2) return;
        pinchActive = false;
        const match = canvas.style.transform.match(/scale\(([^)]+)\)/);
        canvas.style.transform = '';
        applyScale(pinchBaseScale * (match ? parseFloat(match[1]) : 1));
      }, { passive: true });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (!zoomed) renderPage(); }, 200);
      });

      const pdfjs = document.createElement('script');
      pdfjs.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      pdfjs.onload = async () => {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        try {
          pdfDoc = await pdfjsLib.getDocument(PDF_SRC).promise;
          await renderPage();
          canvas.hidden = false;
          pdfMsg.hidden = true;
        } catch {
          pdfMsg.innerHTML =
            `Could not load PDF. <a href="${PDF_SRC}">Download it here</a>.`;
        }
      };
      document.head.appendChild(pdfjs);

    } else {
      // ── Desktop: native iframe ─────────────────────────────
      zoomBtn.classList.add('unavailable');
      const frame = document.createElement('iframe');
      frame.id       = 'pdf-frame';
      frame.src      = PDF_SRC + '#zoom=fitH';
      frame.title    = 'Brass Crosby – information panel';
      frame.tabIndex = 0;
      wrap.appendChild(frame);
    }

    // ── GA page view with content group + source ───────────
    gtag('event', 'page_view', {
      page_id:       PAGE_ID,
      page_num:      PAGE_NUM,
      content_group: PAGE_NUM.substring(0, 1) + 'xx',
      view:          targetView,
      src_param:     src
    });
  </script>

</body>
</html>
