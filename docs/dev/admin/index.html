    let sortCol  = 'num';
    let sortDir  = 1;
    let filterVol  = 'all';
    let filterLive = 'all';
    let searchQ  = '';

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function tick(v) {
      return v ? '<span class="tick"  aria-label="yes">✓</span>'
               : '<span class="cross" aria-label="no">–</span>';
    }

    function render() {
      let rows = PAGES.filter(p => {
        if (filterVol !== 'all' && String(p.volume) !== filterVol) return false;
        if (filterLive === '1' && p.live === false) return false;
        if (filterLive === '0' && p.live !== false) return false;
        if (searchQ) {
          const q = searchQ.toLowerCase();
          if (!p.title.toLowerCase().includes(q) && !p.slug.includes(q)) return false;
        }
        return true;
      });

      rows.sort((a, b) => {
        let av = a[sortCol], bv = b[sortCol];
        if (typeof av === 'boolean') av = av ? 1 : 0;
        if (typeof bv === 'boolean') bv = bv ? 1 : 0;
        if (typeof av === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = rows.map(p => {
        const nl   = `../nl/${p.slug}.html`;
        const qr   = `../qr/${p.num}.html`;
        const easy = `../easy/${p.slug}.html`;
        const rowClass = p.live === false ? ' class="not-live"' : '';
        return `<tr${rowClass}>
          <td class="num">${esc(p.num)}</td>
          <td>${esc(p.title)}</td>
          <td class="slug">${esc(p.slug)}</td>
          <td><span class="vol-badge v${p.volume}">${p.volume}</span></td>
          <td>${tick(p.live !== false)}</td>
          <td>${tick(p.has_easy)}</td>
          <td>${tick(p.has_audio)}</td>
          <td class="links">
            <a href="${nl}"  target="_blank">NL</a>
            <a href="${qr}"  target="_blank">QR</a>
            ${p.has_easy ? `<a href="${easy}" target="_blank">Easy</a>` : ''}
          </td>
        </tr>`;
      }).join('');

      document.getElementById('count').textContent = `${rows.length} of ${PAGES.length} pages`;
      document.getElementById('no-results').hidden = rows.length > 0;
    }

    document.querySelectorAll('thead th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        sortDir = (sortCol === th.dataset.col) ? sortDir * -1 : 1;
        sortCol = th.dataset.col;
        document.querySelectorAll('thead th').forEach(t =>
          t.classList.remove('sort-asc','sort-desc'));
        th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
        render();
      });
    });

    document.querySelectorAll('.filter-group button[data-vol]').forEach(btn => {
      btn.addEventListener('click', () => {
        filterVol = btn.dataset.vol;
        btn.closest('.filter-group').querySelectorAll('button')
          .forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    document.querySelectorAll('.filter-group button[data-live]').forEach(btn => {
      btn.addEventListener('click', () => {
        filterLive = btn.dataset.live;
        btn.closest('.filter-group').querySelectorAll('button')
          .forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    document.getElementById('search').addEventListener('input', e => {
      searchQ = e.target.value.trim();
      render();
    });

    // ── Sanity checks ──────────────────────────────────
    function runSanityChecks() {
      const checks = [
        { label: 'missing PDF',   crit: p => p.live !== false, test: p => !p.has_pdf },
        { label: 'empty title',   crit: () => true,            test: p => !String(p.title||'').trim() },
        { label: 'empty slug',    crit: () => true,            test: p => !String(p.slug||'').trim() },
        { label: 'missing number',crit: () => true,            test: p => !String(p.num||'').trim() },
      ];

      const pageIssues = [];
      PAGES.forEach(p => {
        const failing = checks.filter(c => c.test(p)).map(c => ({ label: c.label, crit: c.crit(p) }));
        if (failing.length) pageIssues.push({ page: p, failing });
      });

      const panel = document.getElementById('sanity-panel');
      if (pageIssues.length === 0) {
        panel.className = 'sanity-panel ok';
        panel.innerHTML = '✓ All pages pass sanity checks.';
        return;
      }

      const total = pageIssues.reduce((n, pi) => n + pi.failing.length, 0);
      const items = pageIssues.map(({ page, failing }) => {
        const id    = page.num && page.title ? `${esc(page.num)} – ${esc(page.title)}` : `(num: ${esc(page.num||'?')})`;
        const tags  = failing.map(f => f.crit ? `<span class="crit">${f.label}</span>` : f.label).join(', ');
        return `<li>${id}: ${tags}</li>`;
      }).join('');

      panel.className = 'sanity-panel warn';
      panel.innerHTML = `<strong>⚠ ${total} issue${total !== 1 ? 's' : ''} on ${pageIssues.length} page${pageIssues.length !== 1 ? 's' : ''}:</strong><ul>${items}</ul>`;
    }

    render();
    runSanityChecks();
  </script>
