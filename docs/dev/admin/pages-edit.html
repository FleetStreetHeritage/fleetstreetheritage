    let pages = INITIAL.map(p => ({...p}));
    let dirty = false;

    // ── Sort / filter state ────────────────────────────────
    let sortCol = 'num';
    let sortDir = 1;
    let filterVol = 'all';
    let searchQ = '';
    let editingIdx = null;   // index into pages[] currently being edited

    // ── Helpers ────────────────────────────────────────────
    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function markDirty() {
      dirty = true;
      document.getElementById('unsaved-badge').classList.add('visible');
      document.getElementById('total-count').textContent = pages.length;
    }

    function tick(v)  { return v ? '<span class="tick"  aria-label="yes">✓</span>'
                                 : '<span class="cross" aria-label="no">–</span>'; }
    function volBadge(v) {
      return `<span class="vol-badge v${v}">${v}</span>`;
    }

    // ── Render ─────────────────────────────────────────────
    function render() {
      // Build filtered + sorted view (indices into pages[])
      let view = pages
        .map((p, i) => ({...p, _i: i}))
        .filter(p => {
          if (filterVol !== 'all' && String(p.volume) !== filterVol) return false;
          if (searchQ) {
            const q = searchQ.toLowerCase();
            if (!p.title.toLowerCase().includes(q) && !p.slug.includes(q)) return false;
          }
          return true;
        });

      view.sort((a, b) => {
        let av = a[sortCol], bv = b[sortCol];
        if (typeof av === 'boolean') av = av ? 1 : 0;
        if (typeof bv === 'boolean') bv = bv ? 1 : 0;
        if (typeof av === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = view.map(p => {
        const i = p._i;
        if (i === editingIdx) return editRow(p, i);
        return viewRow(p, i);
      }).join('');

      document.getElementById('count').textContent = `${view.length} of ${pages.length} pages`;
      document.getElementById('no-results').hidden = view.length > 0;
      runSanityChecks();
    }

    // ── Sanity checks ──────────────────────────────────
    function runSanityChecks() {
      const checks = [
        { label: 'missing PDF',   crit: p => p.live !== false, test: p => !p.has_pdf },
        { label: 'empty title',   crit: () => true,            test: p => !String(p.title||'').trim() },
        { label: 'empty slug',    crit: () => true,            test: p => !String(p.slug||'').trim() },
        { label: 'missing number',crit: () => true,            test: p => !String(p.num||'').trim() },
      ];

      const pageIssues = [];
      pages.forEach(p => {
        const failing = checks.filter(c => c.test(p)).map(c => ({ label: c.label, crit: c.crit(p) }));
        if (failing.length) pageIssues.push({ page: p, failing });
      });

      const panel = document.getElementById('sanity-panel');
      if (pageIssues.length === 0) {
        panel.className = 'sanity-panel ok';
        panel.innerHTML = '✓ All pages pass sanity checks.';
        return;
      }

      const total = pageIssues.reduce((n, pi) => n + pi.failing.length, 0);
      const items = pageIssues.map(({ page, failing }) => {
        const id   = page.num && page.title ? `${esc(page.num)} – ${esc(page.title)}` : `(num: ${esc(page.num||'?')})`;
        const tags = failing.map(f => f.crit ? `<span class="crit">${f.label}</span>` : f.label).join(', ');
        return `<li>${id}: ${tags}</li>`;
      }).join('');

      panel.className = 'sanity-panel warn';
      panel.innerHTML = `<strong>⚠ ${total} issue${total !== 1 ? 's' : ''} on ${pageIssues.length} page${pageIssues.length !== 1 ? 's' : ''}:</strong><ul>${items}</ul>`;
    }

    function viewRow(p, i) {
      const nl   = `../nl/${p.slug}.html`;
      const qr   = `../qr/${p.num}.html`;
      const easy = `../easy/${p.slug}.html`;
      const dimClass = p.live === false ? ' class="dim"' : '';
      return `<tr data-i="${i}"${dimClass}>
        <td class="num">${esc(p.num)}</td>
        <td>${esc(p.title)}</td>
        <td class="slug">${esc(p.slug)}</td>
        <td>${volBadge(p.volume)}</td>
        <td><input type="checkbox" ${p.live !== false ? 'checked' : ''}
              aria-label="Live" onchange="toggleLive(${i}, this.checked)"></td>
        <td>${tick(p.has_easy)}</td>
        <td>${tick(p.has_audio)}</td>
        <td class="links">
          <a href="${nl}"   target="_blank">NL</a>
          <a href="${qr}"   target="_blank">QR</a>
          ${p.has_easy ? `<a href="${easy}" target="_blank">Easy</a>` : ''}
        </td>
        <td class="actions">
          <a onclick="startEdit(${i})">Edit</a>
          <a class="del" onclick="deletePage(${i})">Delete</a>
        </td>
      </tr>`;
    }

    function editRow(p, i) {
      return `<tr data-i="${i}" class="editing">
        <td><input class="edit-input" id="e-num"    value="${esc(p.num)}"></td>
        <td><input class="edit-input" id="e-title"  value="${esc(p.title)}"></td>
        <td><input class="edit-input mono" id="e-slug" value="${esc(p.slug)}"></td>
        <td>
          <select class="edit-input" id="e-volume">
            <option value="1" ${p.volume==1?'selected':''}>1</option>
            <option value="2" ${p.volume==2?'selected':''}>2</option>
            <option value="3" ${p.volume==3?'selected':''}>3</option>
          </select>
        </td>
        <td><input type="checkbox" id="e-live" ${p.live !== false ? 'checked' : ''}></td>
        <td>${tick(p.has_easy)}</td>
        <td>${tick(p.has_audio)}</td>
        <td></td>
        <td class="actions">
          <button class="btn btn-save"   onclick="saveEdit(${i})">Save</button>
          <button class="btn btn-cancel" onclick="cancelEdit()">Cancel</button>
        </td>
      </tr>`;
    }

    // ── Actions ────────────────────────────────────────────
    function toggleLive(i, val) {
      pages[i].live = val;
      markDirty();
      // re-render just this row to update dimming without losing scroll
      const tr = document.querySelector(`tr[data-i="${i}"]`);
      if (tr) tr.outerHTML = viewRow(pages[i], i);
    }

    function startEdit(i) {
      if (editingIdx !== null && editingIdx !== i) cancelEdit();
      editingIdx = i;
      render();
      document.getElementById('e-title')?.focus();
    }

    function saveEdit(i) {
      const num    = document.getElementById('e-num').value.trim();
      const title  = document.getElementById('e-title').value.trim();
      const slug   = document.getElementById('e-slug').value.trim();
      const volume = parseInt(document.getElementById('e-volume').value, 10);
      const live   = document.getElementById('e-live').checked;

      if (!num || !title || !slug) {
        alert('Number, title and slug are all required.');
        return;
      }

      // If num changed, has_pdf status is unknown until next regeneration
      const has_pdf = (num === String(pages[i].num)) ? pages[i].has_pdf : false;
      pages[i] = { ...pages[i], num, title, slug, volume, live, has_pdf };
      editingIdx = null;
      markDirty();
      render();
    }

    function cancelEdit() {
      // If this was a newly added blank row, remove it
      if (editingIdx !== null && pages[editingIdx]._new) {
        pages.splice(editingIdx, 1);
      }
      editingIdx = null;
      render();
    }

    function deletePage(i) {
      if (!confirm(`Delete "${pages[i].title}"?`)) return;
      if (editingIdx === i) editingIdx = null;
      pages.splice(i, 1);
      markDirty();
      render();
    }

    // ── Add page ───────────────────────────────────────────
    document.getElementById('btn-add').addEventListener('click', () => {
      const i = pages.length;
      pages.push({ num: '', title: '', slug: '', volume: 1, live: true,
                   has_pdf: false, has_easy: false, has_audio: false, _new: true });
      editingIdx = i;
      // Temporarily clear filters so the new row is visible
      filterVol = 'all';
      searchQ = '';
      document.getElementById('search').value = '';
      document.querySelectorAll('.filter-group button').forEach(b => {
        b.classList.toggle('active', b.dataset.vol === 'all');
      });
      render();
      document.getElementById('e-num')?.focus();
    });

    // ── Export ─────────────────────────────────────────────
    document.getElementById('btn-export').addEventListener('click', () => {
      // Strip computed/internal fields before export
      const clean = pages.map(({ has_pdf, has_easy, has_audio, _new, ...rest }) => rest);
      const out = JSON.stringify({ pages: clean }, null, 2);
      const blob = new Blob([out], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pages.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // ── Load ───────────────────────────────────────────────
    document.getElementById('btn-load').addEventListener('click', () => {
      document.getElementById('load-input').click();
    });

    document.getElementById('load-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.pages || !Array.isArray(data.pages)) throw new Error('Invalid format');
          // Preserve has_easy / has_audio from current data where num matches
          const statusMap = {};
          pages.forEach(p => { statusMap[p.num] = { has_pdf: p.has_pdf, has_easy: p.has_easy, has_audio: p.has_audio }; });
          pages = data.pages.map(p => ({
            has_pdf: false, has_easy: false, has_audio: false,
            ...statusMap[p.num],
            ...p,
          }));
          editingIdx = null;
          dirty = false;
          document.getElementById('unsaved-badge').classList.remove('visible');
          render();
        } catch (err) {
          alert('Could not load JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ── Sort ───────────────────────────────────────────────
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        sortDir = (sortCol === col) ? sortDir * -1 : 1;
        sortCol = col;
        document.querySelectorAll('thead th').forEach(t =>
          t.classList.remove('sort-asc', 'sort-desc'));
        th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
        render();
      });
    });

    // ── Filter ─────────────────────────────────────────────
    document.querySelectorAll('.filter-group button').forEach(btn => {
      btn.addEventListener('click', () => {
        filterVol = btn.dataset.vol;
        document.querySelectorAll('.filter-group button')
          .forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    // ── Search ─────────────────────────────────────────────
    document.getElementById('search').addEventListener('input', e => {
      searchQ = e.target.value.trim();
      render();
    });

    // ── Keyboard esc to cancel edit ────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && editingIdx !== null) cancelEdit();
    });

    render();
  </script>
