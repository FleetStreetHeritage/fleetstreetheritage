<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Conduit (Easy Read) – The Heritage of Fleet Street</title>
  <meta name="description" content="Easy Read version: The Great Conduit">

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E01B51HMZL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Source code → readable label, and → GA's own traffic source, so a QR
    // arrival is attributed to Wall/Leaflet/… for the whole visit
    const SRC_LABELS = {"wl":"Wall","lf":"Leaflet","po":"Poster","wb":"Web","in":"Internal","bk":"Book"};
    function expandSrc(code) { return code ? (SRC_LABELS[code] || code) : ''; }
    function srcCampaign() {
      const code = new URLSearchParams(window.location.search).get('s');
      if (!code || ["in", "wb"].includes(code)) return {};
      return { campaign_source: expandSrc(code).toLowerCase(), campaign_medium: 'qr' };
    }
    // send_page_view off: the enriched page_view below is the only one
    gtag('config', 'G-E01B51HMZL', Object.assign({ send_page_view: false }, srcCampaign()));
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fsh-blue:    #254760;
      --fsh-yellow:  #FFFF66;
      --fsh-white:   #ffffff;
      --bar-full:    4rem;
      --bar-compact: 2.75rem;
      --transition:  0.3s ease;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #555;   /* shows below the panel on phones until there is a real footer */
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #fsh-bar {
      background: var(--fsh-blue);
      color: var(--fsh-white);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      height: var(--bar-full);
      transition: height var(--transition);
      flex-shrink: 0;
      overflow: hidden;
    }

    body.returning #fsh-bar { height: var(--bar-compact); }

    #fsh-bar .site-title {
      font-size: 1rem;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    body.returning #fsh-bar .site-title { font-size: 0.85rem; }

    /* Site title as a home link — visually identical to the plain title */
    #fsh-bar a.site-title,
    #fsh-bar a.site-title:hover,
    #fsh-bar a.site-title:focus {
      border: none;
      padding: 0;
      background: none;
      border-radius: 0;
    }


    #fsh-bar .page-title {
      font-size: 0.9rem;
      color: var(--fsh-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    body.returning #fsh-bar .page-title { font-size: 0.8rem; }

    /* Easy Read badge on bar */
    #fsh-bar .view-badge {
      font-size: 0.7rem;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      font-weight: bold;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #fsh-bar nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #fsh-bar a, #fsh-bar button {
      color: var(--fsh-white);
      text-decoration: none;
      font-size: 0.8rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition);
    }

    #fsh-bar a:hover, #fsh-bar button:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.7);
    }

    #view-toggle {
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      border-color: var(--fsh-yellow);
      font-weight: bold;
    }

    #audio-wrap { display: flex; align-items: center; gap: 0.4rem; }
    audio { height: 1.6rem; max-width: 10rem; }
    .unavailable { display: none !important; }

    #pdf-wrap { flex: 1; overflow: hidden; min-height: 0; }
    #pdf-frame { width: 100%; height: 100%; border: none; display: block; }
    #pdf-wrap.touch { overflow: auto; background: #B3B3B3; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
    #pdf-pages { width: max-content; margin: 0 auto; }   /* centred when narrower than the view */
    .pdf-canvas { display: block; background: #B3B3B3; }
    .pdf-canvas + .pdf-canvas { margin-top: 0.4rem; }
    #pdf-msg { padding: 2rem; color: var(--fsh-blue); font-size: 0.9rem; }
    #pdf-msg a { color: var(--fsh-blue); text-decoration: underline; }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--fsh-yellow);
      color: var(--fsh-blue);
      padding: 0.5rem 1rem;
      font-weight: bold;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }
  </style>
</head>
<body>

  <a class="skip-link" href="#pdf-wrap">Skip to content</a>

  <header id="fsh-bar" role="banner">

    <a class="site-title" href="../index.html" aria-label="The Heritage of Fleet Street">The Heritage of Fleet Street</a>

    <span class="view-badge" aria-label="Easy Read version">Easy Read</span>

    <span class="page-title" aria-current="page">The Great Conduit</span>

    <nav aria-label="Page controls">

      <div id="audio-wrap" class="unavailable" aria-label="Audio narration">
        <audio id="audio-player" controls preload="none" aria-label="Listen to narration">
          <source src="../audio/165.mp3" type="audio/mpeg">
        </audio>
      </div>

      <button id="view-toggle"
              aria-label="Switch to Natural Language version"
              aria-pressed="true">
        Natural Language
      </button>

      <!-- Zoom toggle -->
      <button id="zoom-toggle" aria-label="Zoom in on PDF">Zoom in</button>

      <a id="nav-prev" href="../nl/bouverie-street.html" aria-label="Previous page">&#8592; Prev</a>
      <a id="nav-next" href="../nl/pedestrian-courts-of-fleet-street.html" aria-label="Next page">Next &#8594;</a>

      <a href="../index.html" aria-label="Return to home page">Home</a>

    </nav>
  </header>

  <main id="pdf-wrap"></main>

  <script>
    const PAGE_ID   = 'the-great-conduit';
    const PAGE_NUM  = '165';
    const HAS_AUDIO = false;
    const NL_URL    = '../nl/the-great-conduit.html';
    const AUDIO_SRC = '../audio/165.mp3';

    const STORAGE_KEY = 'fsh_view';
    const VISITED_KEY = 'fsh_visited';
    const params      = new URLSearchParams(window.location.search);
    const src         = params.get('s') || '';


    // Being on this page means view = easy; ensure stored pref matches
    // (unless user arrived via f=1, but we don't redirect from ER page)
    // We do NOT force-write here — the NL page handles f= logic before redirect.
    // Arriving here naturally means we just record easy as the current view.

    // Returning visitor
    if (localStorage.getItem(VISITED_KEY)) {
      document.body.classList.add('returning');
    } else {
      localStorage.setItem(VISITED_KEY, '1');
    }

    // Audio
    if (HAS_AUDIO) {
      const wrap = document.getElementById('audio-wrap');
      wrap.classList.remove('unavailable');

      document.getElementById('audio-player').addEventListener('play', () => {
        gtag('event', 'audio_play', {
          page_id:  PAGE_ID,
          page_num: PAGE_NUM,
          view:     'easy',
          src_param: expandSrc(src)
        });
      });
    }

    // ── PDF rendering (PDF.js canvas on every device) ──────
    // The native iframe is not used by default: browsers set to download
    // PDFs (a Chrome option, often forced on managed Windows PCs) download
    // the file instead of displaying it. ?pdf=native restores the iframe.
    const PDF_SRC = '../pdfs/E_165_GreatConduit.pdf';
    const wrap    = document.getElementById('pdf-wrap');
    const zoomBtn = document.getElementById('zoom-toggle');

    if (params.get('pdf') !== 'native') {
      // ── PDF.js: one canvas per page, stacked ──────────────
      wrap.classList.add('touch');
      wrap.tabIndex = 0;   // keyboard scrolling of the panel

      const pdfMsg = document.createElement('p');
      pdfMsg.id = 'pdf-msg';
      pdfMsg.textContent = 'Loading…';
      wrap.appendChild(pdfMsg);

      const pages = document.createElement('div');
      pages.id = 'pdf-pages';
      pages.setAttribute('role', 'img');
      pages.setAttribute('aria-label', 'The Great Conduit – Easy Read information panel');
      pages.hidden = true;
      wrap.appendChild(pages);

      const canvases = [];
      let pdfDoc = null, userScale = 1, zoomed = false;

      // Scale 1 = fit the panel to the width of the view. On a wide screen
      // the panel may be zoomed out (or opened) narrower than that, but
      // never narrower than a comfortable reading width.
      const READ_WIDTH = 760, OPEN_WIDTH = 1000;
      const minScale   = () => Math.min(1, READ_WIDTH / wrap.clientWidth);
      const openScale  = () => Math.max(minScale(), Math.min(1, OPEN_WIDTH / wrap.clientWidth));
      const clampScale = s  => Math.min(4, Math.max(minScale(), s));

      // Renders are serialised so a caller can await the one it asked for;
      // a failed render is reported and must not block later ones
      let renderChain = Promise.resolve();
      function renderPage() {
        renderChain = renderChain.then(renderAllPages).catch(err => {
          console.error('PDF render failed', err);
        });
        return renderChain;
      }

      async function renderAllPages() {
        if (!pdfDoc) return;
        const dpr = window.devicePixelRatio || 1;
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          let canvas = canvases[i - 1];
          if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.className = 'pdf-canvas';
            pages.appendChild(canvas);
            canvases.push(canvas);
          }
          const baseVP   = page.getViewport({ scale: 1 });
          const fitScale = wrap.clientWidth / baseVP.width;
          // iOS silently blanks a canvas above ~16.7M pixels; at full zoom
          // on a 3x phone a panel would exceed that, so trade sharpness
          // for a canvas that renders.
          const cssW = baseVP.width * fitScale * userScale, cssH = baseVP.height * fitScale * userScale;
          const res  = Math.min(dpr, Math.sqrt(16e6 / (cssW * cssH)));
          const viewport = page.getViewport({ scale: fitScale * userScale * res });
          // Render off-screen, then copy in one step, so the visible canvas
          // keeps showing the old image instead of going blank mid-render
          const off  = document.createElement('canvas');
          off.width  = Math.floor(viewport.width);
          off.height = Math.floor(viewport.height);
          await page.render({ canvasContext: off.getContext('2d'), viewport }).promise;
          canvas.width        = off.width;
          canvas.height       = off.height;
          canvas.style.width  = Math.floor(off.width  / res) + 'px';
          canvas.style.height = Math.floor(off.height / res) + 'px';
          canvas.getContext('2d').drawImage(off, 0, 0);
        }
      }

      // Zoom about an anchor: `view` is a point in the visible area of the
      // panel, `doc` the same point in scrolled content coordinates. After
      // re-rendering, scroll so that point stays under the user's fingers.
      async function applyScale(scale, view, doc) {
        const prev = userScale;
        userScale  = clampScale(scale);
        zoomed     = userScale > openScale() * 1.05;
        zoomBtn.textContent = zoomed ? 'Reset zoom' : 'Zoom in';
        zoomBtn.setAttribute('aria-label',
          zoomed ? 'Reset PDF to its opening size' : 'Zoom in on PDF');
        // Until the new render lands, show the old one scaled about the
        // anchor so the picture never disappears
        const f = userScale / prev;
        pages.style.transformOrigin = `${doc.x}px ${doc.y}px`;
        pages.style.transform       = `scale(${f})`;
        await renderPage();
        pages.style.transform = '';
        wrap.scrollLeft = doc.x * f - view.x;
        wrap.scrollTop  = doc.y * f - view.y;
      }

      function viewCentre() {
        return { x: wrap.clientWidth / 2, y: wrap.clientHeight / 2 };
      }
      function toDoc(view) {
        return { x: view.x + wrap.scrollLeft, y: view.y + wrap.scrollTop };
      }

      zoomBtn.addEventListener('click', () => {
        const view = viewCentre();
        applyScale(zoomed ? openScale() : openScale() * 1.75, view, toDoc(view));
      });

      let pinchActive = false, pinchStartDist = 0, pinchBaseScale = 1;
      let pinchView = { x: 0, y: 0 }, pinchDoc = { x: 0, y: 0 };
      const touchDist = e => Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);

      wrap.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          pinchActive    = true;
          pinchStartDist = touchDist(e);
          pinchBaseScale = userScale;
          const r = wrap.getBoundingClientRect();
          pinchView = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top };
          pinchDoc = toDoc(pinchView);
          // Live preview scales about the point between the fingers
          pages.style.transformOrigin = `${pinchDoc.x}px ${pinchDoc.y}px`;
        }
      }, { passive: true });
      // Non-passive so a two-finger pinch inside the panel is ours alone:
      // otherwise iOS Safari also zooms the whole page, or, when the page
      // is already at minimum zoom, pinches out to the tab overview. The
      // header stays browser-zoomable for accessibility.
      wrap.addEventListener('touchmove', e => {
        if (e.touches.length === 2) e.preventDefault();
        if (!pinchActive || e.touches.length !== 2) return;
        // Preview obeys the same limits as the final zoom, so it never
        // shrinks below fit-width and then snaps back on release
        const ratio = clampScale(pinchBaseScale * touchDist(e) / pinchStartDist) / pinchBaseScale;
        pages.style.transform = `scale(${ratio})`;
      }, { passive: false });
      for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
        wrap.addEventListener(t, e => e.preventDefault());
      }

      // ── Desktop zoom: trackpad pinch and ctrl + mouse wheel ──
      // Chrome/Firefox/Edge deliver a trackpad pinch as a wheel event with
      // ctrlKey set; Mac Safari delivers gesture events (cancelled above,
      // so handled here on non-touch devices only — iOS fires both).
      // Events arrive continuously, so preview with a transform and
      // commit one render when they stop.
      let liveScale = null, liveView, liveDoc, liveTimer;
      function previewZoom(target, view) {
        if (liveScale === null) {
          liveView = view;
          liveDoc  = toDoc(view);
          pages.style.transformOrigin = `${liveDoc.x}px ${liveDoc.y}px`;
        }
        liveScale = clampScale(target);
        pages.style.transform = `scale(${liveScale / userScale})`;
        clearTimeout(liveTimer);
        liveTimer = setTimeout(() => {
          const s = liveScale; liveScale = null;
          applyScale(s, liveView, liveDoc);
        }, 150);
      }
      const pointIn = e => {
        if (!Number.isFinite(e.clientX)) return viewCentre();
        const r = wrap.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      wrap.addEventListener('wheel', e => {
        if (!e.ctrlKey) return;            // plain wheel scrolls as normal
        e.preventDefault();                // ctrl+wheel: ours, not page zoom
        const step = Math.max(-0.3, Math.min(0.3, -e.deltaY * 0.01));
        previewZoom((liveScale ?? userScale) * Math.exp(step), pointIn(e));
      }, { passive: false });
      // iOS fires gesture events alongside the touch pinch above, which
      // takes precedence; pinchActive tells the two apart.
      let gestureBase = 1, gestureView;
      wrap.addEventListener('gesturestart', e => {
        if (pinchActive) return;
        gestureBase = liveScale ?? userScale; gestureView = pointIn(e);
      });
      wrap.addEventListener('gesturechange', e => {
        if (pinchActive || !Number.isFinite(e.scale)) return;
        previewZoom(gestureBase * e.scale, gestureView);
      });
      wrap.addEventListener('touchend', e => {
        if (!pinchActive || e.touches.length >= 2) return;
        pinchActive = false;
        const match = pages.style.transform.match(/scale\(([^)]+)\)/);
        applyScale(pinchBaseScale * (match ? parseFloat(match[1]) : 1), pinchView, pinchDoc);
      }, { passive: true });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!zoomed) { userScale = openScale(); renderPage(); }
        }, 200);
      });

      const pdfjs = document.createElement('script');
      pdfjs.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      pdfjs.onload = async () => {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        try {
          pdfDoc = await pdfjsLib.getDocument(PDF_SRC).promise;
          userScale = openScale();
          await renderPage();
          pages.hidden  = false;
          pdfMsg.hidden = true;
        } catch {
          pdfMsg.innerHTML =
            `Could not load PDF. <a href="${PDF_SRC}">Download it here</a>.`;
        }
      };
      pdfjs.onerror = () => {
        pdfMsg.innerHTML =
          `Could not load the PDF viewer. <a href="${PDF_SRC}">Open the PDF directly</a>.`;
      };
      document.head.appendChild(pdfjs);

    } else {
      // ── Native iframe (?pdf=native) ───────────────────────
      zoomBtn.classList.add('unavailable');
      const frame = document.createElement('iframe');
      frame.id       = 'pdf-frame';
      frame.src      = PDF_SRC + '#zoom=fitH';
      frame.title    = 'The Great Conduit – Easy Read information panel';
      frame.tabIndex = 0;
      wrap.appendChild(frame);
    }

    // Toggle back to NL — saves preference
    document.getElementById('view-toggle').addEventListener('click', () => {
      localStorage.setItem(STORAGE_KEY, 'nl');

      gtag('event', 'view_switch', {
        from:      'easy',
        to:        'nl',
        page_id:   PAGE_ID,
        src_param: expandSrc(src)
      });

      const dest = new URL(NL_URL, window.location.href);
      if (src) dest.searchParams.set('s', src);
      window.location.href = dest.toString();
    });

    // GA page view
    gtag('event', 'page_view', {
      page_id:       PAGE_ID,
      page_num:      PAGE_NUM,
      content_group: PAGE_NUM.substring(0, 1) + 'xx',
      view:          'easy',
      src_param:     expandSrc(src)
    });
  </script>

</body>
</html>
