<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting – The Heritage of Fleet Street</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E01B51HMZL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Source code → readable label, and → GA's own traffic source, so a QR
    // arrival is attributed to Wall/Leaflet/… for the whole visit
    const SRC_LABELS = {"wl":"Wall","lf":"Leaflet","po":"Poster","wb":"Web","in":"Internal","bk":"Book"};
    function expandSrc(code) { return code ? (SRC_LABELS[code] || code) : ''; }
    function srcCampaign() {
      const code = new URLSearchParams(window.location.search).get('s');
      if (!code || ["in", "wb"].includes(code)) return {};
      return { campaign_source: expandSrc(code).toLowerCase(), campaign_medium: 'qr' };
    }
    // send_page_view off: a scan is counted by qr_scan, not as a page view
    gtag('config', 'G-E01B51HMZL', Object.assign({ send_page_view: false }, srcCampaign()));
  </script>
</head>
<body>

  <p>Loading<span aria-hidden="true">…</span>
     <noscript>Please <a id="fallback">click here</a> to continue.</noscript>
  </p>

  <script>
    // ── Per-page config ────────────────────────────────────
    const NL_URL   = '../nl/newspaper-stamp-tax.html';     // e.g. 'dr-johnson.html'
    const EASY_URL = '../easy/newspaper-stamp-tax.html';   // e.g. 'easy-dr-johnson.html'  ('' if none)
    const PAGE_ID  = 'newspaper-stamp-tax';
    const PAGE_NUM = '122';

    // ── Read URL params ────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const src    = params.get('s') || '';
    const vParam = params.get('v') || '';
    const fParam = parseInt(params.get('f') ?? '0', 10);


    // ── Resolve view ───────────────────────────────────────
    const STORAGE_KEY = 'fsh_view';

    function resolveView() {
      const stored = localStorage.getItem(STORAGE_KEY) || '';

      if (fParam === 2 && vParam) {
        localStorage.setItem(STORAGE_KEY, vParam);
        return vParam;
      }
      if (fParam === 1 && vParam) return vParam;
      // f=0
      return stored || vParam || 'nl';
    }

    const view = resolveView();
    const hasEasy = EASY_URL !== '';

    // ── Build destination URL ──────────────────────────────
    const base = (view === 'easy' && hasEasy) ? EASY_URL : NL_URL;
    const dest = new URL(base, window.location.href);
    if (src) dest.searchParams.set('s', src);

    // ── Fire GA event before redirect ─────────────────────
    gtag('event', 'qr_scan', {
      page_id:    PAGE_ID,
      page_num:   PAGE_NUM,
      src_param:  expandSrc(src),
      view_param: vParam,
      force:      fParam,
      routed_to:  view
    });

    // Fallback link for noscript / slow GA
    document.querySelector('#fallback') && (document.querySelector('#fallback').href = dest.toString());

    // Short delay so GA event has time to send, then redirect
    setTimeout(() => window.location.replace(dest.toString()), 300);
  </script>

</body>
</html>
